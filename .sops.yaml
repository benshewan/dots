keys:
  - &admin_benshewan 
  - &admin_yubi5A 
  - &navis 
  - &caelum 
  - &apus 

creation_rules:
  # Shared secrets: readable by the admin key and both hosts.
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin_benshewan
          - *admin_yubi5A
          - *navis
          - *caelum
          - *apus

  # Host-specific secrets.
  - path_regex: secrets/hosts/navis\.yaml$
    key_groups:
      - age:
          - *admin_benshewan
          - *admin_yubi5A
          - *navis
  - path_regex: secrets/hosts/caelum\.yaml$
    key_groups:
      - age:
          - *admin_benshewan
          - *admin_yubi5A
          - *caelum
  - path_regex: secrets/hosts/apus\.yaml$
    key_groups:
      - age:
          - *admin_benshewan
          - *admin_yubi5A
          - *apus
