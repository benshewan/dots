keys:
  - &admin_benshewan 
  - &navis 
  - &caelum 

creation_rules:
  # Shared secrets: readable by the admin key and both hosts.
  - path_regex: secrets/common\.yaml$
    key_groups:
      - age:
          - *admin_benshewan
          - *navis
          - *caelum

  # Host-specific secrets.
  - path_regex: secrets/hosts/navis\.yaml$
    key_groups:
      - age:
          - *admin_benshewan
          - *navis
  - path_regex: secrets/hosts/caelum\.yaml$
    key_groups:
      - age:
          - *admin_benshewan
          - *caelum
